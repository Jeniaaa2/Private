Cloud Harvester
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python cloud_harvester.py
      - run: |
          git config user.name "Cloud-AI-Bot"
          git config user.email "bot@github.com"
          git add chat_knowledge.txt
          git commit -m "Cloud arXiv harvest" || exit 0
          git push
